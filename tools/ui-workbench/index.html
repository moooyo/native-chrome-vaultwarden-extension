<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>密屿 · 生产组件验证</title><link rel="stylesheet" href="ui/fonts/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 'Segoe UI','Microsoft YaHei',sans-serif;color:#25354c;background:#edf2f8}button{font:inherit;cursor:pointer}header{display:flex;gap:18px;align-items:center;padding:15px 24px;background:#fff;border-bottom:1px solid #dce4ef}header strong{font-size:16px}header span{color:#536780;font-size:12px}header button{margin-left:auto;background:#fff;border:1px solid #cbd7e6;border-radius:7px;padding:7px 13px}.layout{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:calc(100vh - 62px)}aside{padding:10px 14px 30px;border-right:1px solid #dce4ef;background:#f8fafc;height:calc(100vh - 62px);overflow:auto;position:sticky;top:0}aside h2{font-size:11px;font-weight:600;letter-spacing:.05em;color:#728197;margin:20px 9px 7px}aside button{width:100%;display:block;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;color:#42526b;font-size:13px}aside button:hover{background:#edf2f9}aside button[aria-current=page]{color:#185bcc;background:#e7effd;font-weight:600}.content{min-width:0}.context{padding:15px 22px;background:#fff;border-bottom:1px solid #dce4ef}.context-row{display:flex;align-items:center;gap:20px}.context h1{font-size:17px;margin:0}.context small{font-size:11px;color:#667990}.context button{margin-left:auto;background:#fff;border:1px solid #cfdaea;border-radius:6px;padding:5px 9px;font-size:12px;color:#566780}#fixture-help{margin-top:8px;font-size:11px;color:#637790}#fixture-status{font-size:11px;color:#6b7c92}#stage{min-height:700px}#stage[data-kind=popup]{padding:30px;display:flex;justify-content:center;align-items:flex-start}#stage[data-kind=popup]>vw-popup-app{flex:none;box-shadow:0 16px 45px #172f5020;border:1px solid #d5dfec;border-radius:16px;overflow:hidden}#stage[data-kind=workspace]>vw-popup-app{display:block;width:100%;min-height:740px}#stage iframe{display:block;border:0;width:100%;height:780px;background:white}details{margin:16px 22px;color:#738199;font-size:11px}pre{white-space:pre-wrap}button:focus-visible{outline:2px solid #2c6ad7;outline-offset:2px}@media(max-width:950px){.layout{grid-template-columns:174px minmax(0,1fr)}aside{padding-inline:8px}.context{padding-inline:14px}header{padding:12px 16px}header span{display:none}#stage[data-kind=popup]{padding:16px 6px}}
</style></head><body><header><strong>密屿 · 生产组件验证</strong><span>运行 src 中的真实组件 · 数据与服务调用由测试适配器提供</span><button id="reset" type="button">重置当前场景</button></header><div class="layout"><aside><nav id="scenarios" aria-label="验证场景"></nav></aside><main class="content"><div class="context"><div class="context-row"><h1 id="scenario-title"></h1><button id="fail-next" type="button">下一次保存模拟失败</button></div><div id="fixture-help"></div><div id="fixture-status" role="status"></div></div><section id="stage" aria-label="真实组件画布"></section><details><summary>测试调用记录（不记录表单值）</summary><pre id="calls"></pre></details></main></div><script type="module" src="entry.js"></script></body></html>
